<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=IBM+Plex+Sans+Arabic:wght@500;600;700&amp;display=swap">
<style>

a{color:#7E9CF8}a:hover{color:#A9BCFA}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0F1115; font-family: 'Plus Jakarta Sans', sans-serif; color: #ECEEF2; display: flex; flex-direction: column; overflow: hidden">

  <div style="padding: 28px 20px 12px">
    <h1 style="margin: 0; font-size: 28px; font-weight: 800; letter-spacing: -0.02em">Settings</h1>
  </div>

  <div style="flex: 1; padding: 0 20px; display: flex; flex-direction: column; gap: 8px">
    <div style="font-size: 13px; font-weight: 700; color: #9AA0AE; padding-top: 4px">Language and display</div>
    <div style="background: #1A1D24; border-radius: 18px; display: flex; flex-direction: column">
      <div style="height: 52px; padding: 0 8px 0 16px; display: flex; align-items: center; gap: 12px">
        <span style="flex: 1; font-size: 15px; font-weight: 600">Language</span>
        <div role="group" aria-label="Language" style="display: flex; background: #2A2E37; border-radius: 12px; padding: 3px; gap: 2px">
          <button aria-pressed="true" style="height: 36px; padding: 0 12px; border: none; border-radius: 9px; background: #3A3F4B; font-family: inherit; font-size: 13px; font-weight: 800; color: #ECEEF2">English</button>
          <button aria-pressed="false" style="height: 36px; padding: 0 12px; border: none; border-radius: 9px; background: transparent; font-family: 'IBM Plex Sans Arabic', sans-serif; font-size: 14px; font-weight: 600; color: #A9AFBC">العربية</button>
        </div>
      </div>
      <div style="height: 1px; background: #2A2E37; margin: 0 16px"></div>
      <div style="height: 52px; padding: 0 8px 0 16px; display: flex; align-items: center; gap: 12px">
        <span style="flex: 1; font-size: 15px; font-weight: 600">Numbers</span>
        <div role="group" aria-label="Number style" style="display: flex; background: #2A2E37; border-radius: 12px; padding: 3px; gap: 2px">
          <button aria-pressed="true" style="height: 36px; padding: 0 14px; border: none; border-radius: 9px; background: #3A3F4B; font-family: inherit; font-size: 13px; font-weight: 800; color: #ECEEF2">123</button>
          <button aria-pressed="false" style="height: 36px; padding: 0 14px; border: none; border-radius: 9px; background: transparent; font-family: 'IBM Plex Sans Arabic', sans-serif; font-size: 14px; font-weight: 600; color: #A9AFBC">١٢٣</button>
        </div>
      </div>
      <div style="height: 1px; background: #2A2E37; margin: 0 16px"></div>
      <div style="height: 52px; padding: 0 8px 0 16px; display: flex; align-items: center; gap: 12px">
        <span style="flex: 1; font-size: 15px; font-weight: 600">Theme</span>
        <div role="group" aria-label="Theme" style="display: flex; background: #2A2E37; border-radius: 12px; padding: 3px; gap: 2px">
          <button aria-pressed="false" style="height: 36px; padding: 0 10px; border: none; border-radius: 9px; background: transparent; font-family: inherit; font-size: 13px; font-weight: 600; color: #A9AFBC">System</button>
          <button aria-pressed="false" style="height: 36px; padding: 0 10px; border: none; border-radius: 9px; background: transparent; font-family: inherit; font-size: 13px; font-weight: 600; color: #A9AFBC">Light</button>
          <button aria-pressed="true" style="height: 36px; padding: 0 10px; border: none; border-radius: 9px; background: #3A3F4B; font-family: inherit; font-size: 13px; font-weight: 800; color: #ECEEF2">Dark</button>
        </div>
      </div>
      <div style="height: 1px; background: #2A2E37; margin: 0 16px"></div>
      <button style="height: 52px; padding: 0 16px; border: none; background: transparent; display: flex; align-items: center; gap: 8px; font-family: inherit; color: #ECEEF2; text-align: left">
        <span style="flex: 1; font-size: 15px; font-weight: 600">Week starts on</span><span style="font-size: 15px; font-weight: 700">Saturday</span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9AA0AE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"></path></svg>
      </button>
    </div>

    <div style="font-size: 13px; font-weight: 700; color: #9AA0AE; padding-top: 6px">Defaults for new reminders</div>
    <div style="background: #1A1D24; border-radius: 18px; display: flex; flex-direction: column">
      <button style="height: 52px; padding: 0 16px; border: none; background: transparent; display: flex; align-items: center; gap: 8px; font-family: inherit; color: #ECEEF2; text-align: left">
        <span style="flex: 1; font-size: 15px; font-weight: 600">Alert time</span><span style="font-size: 15px; font-weight: 700">9:00 AM</span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9AA0AE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"></path></svg>
      </button>
      <div style="height: 1px; background: #2A2E37; margin: 0 16px"></div>
      <button style="height: 52px; padding: 0 16px; border: none; background: transparent; display: flex; align-items: center; gap: 8px; font-family: inherit; color: #ECEEF2; text-align: left">
        <span style="flex: 1; font-size: 15px; font-weight: 600">Remind me</span><span style="font-size: 15px; font-weight: 700">Day of, 1 day before</span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9AA0AE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"></path></svg>
      </button>
    </div>

    <div style="font-size: 13px; font-weight: 700; color: #9AA0AE; padding-top: 6px">So alerts are never missed</div>
    <div style="background: #1A1D24; border-radius: 18px; display: flex; flex-direction: column">
      <div style="height: 52px; padding: 0 16px; display: flex; align-items: center; gap: 8px">
        <span style="flex: 1; font-size: 15px; font-weight: 600">Notifications</span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#3CC2AF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6L9 17l-5-5"></path></svg><span style="font-size: 14px; font-weight: 700; color: #3CC2AF">Allowed</span>
      </div>
      <div style="height: 1px; background: #2A2E37; margin: 0 16px"></div>
      <div style="height: 52px; padding: 0 16px; display: flex; align-items: center; gap: 8px">
        <span style="flex: 1; font-size: 15px; font-weight: 600">Exact alarms</span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#3CC2AF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6L9 17l-5-5"></path></svg><span style="font-size: 14px; font-weight: 700; color: #3CC2AF">Allowed</span>
      </div>
      <div style="height: 1px; background: #2A2E37; margin: 0 16px"></div>
      <div style="height: 56px; padding: 0 8px 0 16px; display: flex; align-items: center; gap: 8px">
        <span style="flex: 1; display: flex; flex-direction: column"><span style="font-size: 15px; font-weight: 600">Battery</span><span style="font-size: 12px; font-weight: 700; color: #F0A04B">Restricted · alerts may be late</span></span>
        <button style="height: 40px; padding: 0 16px; border: none; border-radius: 12px; background: #ECEEF2; color: #0F1115; font-family: inherit; font-size: 13px; font-weight: 700">Fix</button>
      </div>
    </div>

    <div style="display: flex; gap: 8px; padding-top: 6px">
      <button style="flex: 1; height: 48px; border-radius: 14px; border: 1px solid #343944; background: #1A1D24; color: #ECEEF2; font-family: inherit; font-weight: 700; font-size: 14px">Export backup</button>
      <button style="flex: 1; height: 48px; border-radius: 14px; border: 1px solid #343944; background: #1A1D24; color: #ECEEF2; font-family: inherit; font-weight: 700; font-size: 14px">Import backup</button>
    </div>
  </div>

  <nav style="height: 76px; background: #1A1D24; border-top: 1px solid #2A2E37; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); align-items: center">
    <a href="Home.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #9AA0AE; font-size: 12px; font-weight: 600"><span style="width: 56px; height: 30px; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#9AA0AE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10l9-7 9 7v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"></path></svg></span>Home</a>
    <a href="Calendar.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #9AA0AE; font-size: 12px; font-weight: 600"><span style="width: 56px; height: 30px; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#9AA0AE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"></rect><path d="M16 2v4M8 2v4M3 10h18"></path></svg></span>Calendar</a>
    <a href="AddReminder.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #9AA0AE; font-size: 12px; font-weight: 600"><span style="width: 56px; height: 30px; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#9AA0AE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"></path></svg></span>All</a>
    <a href="Settings.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #ECEEF2; font-size: 12px; font-weight: 700"><span style="width: 56px; height: 30px; border-radius: 15px; background: #24305A; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ECEEF2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"></path></svg></span>Settings</a>
  </nav>
</div>
